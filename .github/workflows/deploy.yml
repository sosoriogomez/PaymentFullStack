name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write # OIDC: no long-lived AWS keys (I-17)
  contents: read

env:
  STAGE: prod
  OUTPUTS_FILE: infra/outputs.json

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build the Lambda bundle (tsc + esbuild, ADR-005)
        run: npm run build:lambda -w apps/api

      - name: Deploy the infrastructure
        working-directory: infra
        run: >-
          npx cdk deploy --all --require-approval never --outputs-file outputs.json
          -c stage=${{ env.STAGE }}
          -c pgHost=${{ vars.PG_HOST }}

      # The new code is already live here: migrations must be expand/contract (I-16).
      - name: Run migrations and seed
        run: ./infra/scripts/invoke-migrate.sh

      - name: Build the SPA
        run: npm run build -w apps/web
        env:
          VITE_API_BASE_URL: /api
          VITE_PG_BASE_URL: ${{ vars.PG_BASE_URL }}
          VITE_PG_PUBLIC_KEY: ${{ vars.PG_PUBLIC_KEY }}

      - name: Publish the SPA
        run: ./infra/scripts/publish-web.sh

      - name: Smoke tests
        run: ./infra/scripts/smoke-test.sh
